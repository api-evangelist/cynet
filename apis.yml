aid: cynet
name: Cynet
description: 'Cynet is a unified, AI-powered cybersecurity platform built for MSPs and lean
  IT/security teams that consolidates endpoint (EDR/EPP), network, email, cloud/SaaS, mobile,
  and identity protection into a single agent and console. Its CyAI machine-learning engine
  automatically detects and remediates the majority of threats, CyOps delivers 24x7 managed
  detection and response, and built-in SOAR playbooks automate response across 80+ pre-built
  integrations. Cynet exposes a REST API (Cynet 360) for programmatic access to alerts,
  hosts, remediation, scanning, and account operations, offered as an On-Prem V1 API and a
  SaaS V3 API, authenticated with a tenant-scoped access token. This profile was surfaced as
  a portfolio company of Norwest Venture Partners and enriched by the API Evangelist pipeline.'
